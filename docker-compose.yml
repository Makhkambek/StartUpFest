services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sfrc-next:latest
    container_name: sfrc-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/a"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
